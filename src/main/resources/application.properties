spring.application.name=passeio-cavalo
server.port=${PORT:8080}

# Maior tabuleiro aceito no cálculo (de 1 a 8). Padrão 7: o 7x7 pode levar dias,
# por isso use passeio.tempo-maximo para limitar a duração. O 8x8 é inviável.
passeio.dimensao-maxima=${PASSEIO_DIMENSAO_MAXIMA:7}

# Duração máxima de um cálculo (ex.: 30m, 12h, 2d). 0 = sem limite.
passeio.tempo-maximo=${PASSEIO_TEMPO_MAXIMO:0s}

# Threads do cálculo. 0 = uma por núcleo da máquina.
passeio.paralelismo=${PASSEIO_PARALELISMO:0}

# Quantos cálculos terminados ficam guardados para consulta.
passeio.historico-maximo=${PASSEIO_HISTORICO_MAXIMO:100}
