name: CD - Publicar no GitHub Packages

# Publica o pacote Maven (jar) e a imagem Docker no GitHub Packages.
# - Automático: ao publicar uma release no GitHub.
# - Manual: aba Actions > "Run workflow", informando a tag (ex.: v1.0.0).
# A versão publicada é a da tag, sem o "v" (v1.0.1 -> 1.0.1).

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout da tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github

      - name: Definir versão a partir da tag
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mvn -B -q versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Compilar e testar
        env:
          API_TOKEN: token-publicacao
        run: mvn -B verify

      # O GitHub Packages exige nomes em minúsculas. A partir da v1.0.1 o pom.xml já usa
      # br.com.davidalain:passeio-cavalo e é publicado com "mvn deploy" (jar + jar -exec + pom).
      # Tags antigas (artifactId com maiúsculas) são publicadas com essas coordenadas via deploy-file.
      - name: Publicar pacote Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(mvn -B -q help:evaluate -Dexpression=project.artifactId -DforceStdout)
          if [ "${ARTIFACT_ID}" = "passeio-cavalo" ]; then
            mvn -B deploy -DskipTests
            exit 0
          fi
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -1)
          mvn -B deploy:deploy-file \
            -DgroupId=br.com.davidalain \
            -DartifactId=passeio-cavalo \
            -Dversion="${VERSION}" \
            -Dpackaging=jar \
            -Dfile="${JAR}" \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/${{ github.repository }}

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
